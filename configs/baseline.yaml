seed: 42
test_size: 0.2
batch_size: 32
max_epochs: 500
early_stopping_patience: 30
device: auto
experiments:
  E0:
    hidden_dims: [64, 32]
    dropout: 0.0
    learning_rate: 0.001
    weight_decay: 0.0
  E1:
    hidden_dims: [128, 64, 32]
    dropout: [0.15, 0.10]
    learning_rate: 0.001
    weight_decay: 0.0001
  E2:
    hidden_dims: [256, 128, 64]
    dropout: [0.20, 0.15]
    learning_rate: 0.001
    weight_decay: 0.0001
  E3:
    hidden_dims: [128, 64, 32]
    dropout: [0.15, 0.10]
    learning_rate: 0.0005
    weight_decay: 0.0001
  E4:
    hidden_dims: [128, 64, 32]
    dropout: [0.25, 0.15]
    learning_rate: 0.001
    weight_decay: 0.001
